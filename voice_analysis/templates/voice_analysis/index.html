<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASPER Voice Analysis</title>
    <style>
        :root {
            --bg: #f3efe7;
            --panel: rgba(255, 252, 246, 0.94);
            --ink: #1d2939;
            --muted: #526071;
            --accent: #0f766e;
            --accent-soft: rgba(15, 118, 110, 0.12);
            --line: rgba(148, 163, 184, 0.22);
            --shadow: rgba(15, 23, 42, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 30%),
                radial-gradient(circle at bottom right, rgba(217, 119, 6, 0.10), transparent 24%),
                linear-gradient(135deg, #f7f4ed 0%, #ece4d6 100%);
        }

        .page {
            width: min(1120px, calc(100vw - 32px));
            margin: 40px auto;
            padding: 40px;
            border: 1px solid var(--line);
            border-radius: 32px;
            background: var(--panel);
            box-shadow: 0 24px 70px var(--shadow);
            backdrop-filter: blur(10px);
        }

        .hero {
            display: grid;
            gap: 12px;
            margin-bottom: 28px;
        }

        .eyebrow {
            width: fit-content;
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.3rem, 6vw, 4.8rem);
            letter-spacing: -0.05em;
            line-height: 0.95;
        }

        .lead {
            max-width: 720px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .card {
            display: grid;
            gap: 16px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(248, 250, 252, 0.95)),
                var(--panel);
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
        }

        .card h2 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
        }

        .card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            padding: 12px 18px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            transition: transform 180ms ease, box-shadow 180ms ease;
            box-shadow: 0 14px 28px rgba(15, 118, 110, 0.24);
        }

        .card-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 36px rgba(15, 118, 110, 0.28);
        }

        @media (max-width: 640px) {
            .page {
                width: calc(100vw - 20px);
                margin: 12px auto;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <span class="eyebrow">KASPER</span>
            <h1>KASPER Voice Analysis</h1>
            <p class="lead">음성 분석 워크플로우를 한 곳에서 시작하는 진입 페이지입니다. 아래 카드에서 원하는 분석 도구로 이동할 수 있습니다.</p>
        </section>

        <section class="cards" aria-label="Voice analysis tools">
            <article class="card">
                <h2>sustained a 분석</h2>
                <p>지속 모음 발성 기반 분석 기능을 제공합니다. 현재는 안내 페이지를 우선 제공합니다.</p>
                <a class="card-link" href="{% url 'voice_analysis:sustained_vowel_analysis' %}">sustained a 분석으로 이동</a>
            </article>

            <article class="card">
                <h2>DDK 분석</h2>
                <p>DDK 음성 업로드, waveform 및 envelope 시각화, peak 탐지, 주기성 확인, 재전사까지 한 화면에서 수행합니다.</p>
                <a class="card-link" href="{% url 'voice_analysis:ddk_analysis' %}">DDK 분석으로 이동</a>
            </article>
        </section>
    </main>
</body>
</html>
